<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Speaking Calculator</title>
    <!-- Import Tone.js for reliable, synthesized sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .calculator-container {
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: translateY(0);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .display {
            background: #11111a;
            border-radius: 20px;
            padding: 25px 20px;
            text-align: right;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 100px;
            overflow: hidden;
            position: relative;
        }

        .display::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent);
            pointer-events: none;
        }

        #history {
            font-size: 0.9rem;
            color: #8a8a9d;
            min-height: 1.2em;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        #result {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            transition: all 0.2s ease;
        }
        #result::-webkit-scrollbar { display: none; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            background: #2d2d44;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 20px 0;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), 
                        background 0.2s ease, 
                        box-shadow 0.1s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hover and Active (Click) Animations */
        button:hover {
            background: #363651;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        button:active, button.animating {
            transform: scale(0.9) !important;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0) !important;
            filter: brightness(1.2);
        }

        /* Specific Button Styles */
        .btn-operator {
            background: #ff5e7e;
            color: white;
        }
        .btn-operator:hover { background: #ff7591; }

        .btn-equals {
            background: #00d2ff;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            grid-row: span 2;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }
        .btn-equals:hover {
            background: linear-gradient(135deg, #2ae0ff, #5593e8);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        .btn-clear {
            background: #ffaa00;
            color: #fff;
        }
        .btn-clear:hover { background: #ffc140; }

        .btn-zero {
            grid-column: span 2;
        }

        /* Display pulse animation for results */
        @keyframes pulse-result {
            0% { transform: scale(1); text-shadow: 0 0 0 transparent; }
            50% { transform: scale(1.05); text-shadow: 0 0 15px rgba(0, 210, 255, 0.8); }
            100% { transform: scale(1); text-shadow: 0 0 0 transparent; }
        }
        .pulse { animation: pulse-result 0.4s ease-out; }

    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="display">
            <div id="history"></div>
            <div id="result">0</div>
        </div>
        
        <div class="keypad">
            <button class="btn-clear" data-val="C" data-speech="Clear">C</button>
            <button data-val="(" data-speech="Open Parenthesis">(</button>
            <button data-val=")" data-speech="Close Parenthesis">)</button>
            <button class="btn-operator" data-val="/" data-speech="Divided by">÷</button>
            
            <button data-val="7" data-speech="7">7</button>
            <button data-val="8" data-speech="8">8</button>
            <button data-val="9" data-speech="9">9</button>
            <button class="btn-operator" data-val="*" data-speech="Times">×</button>
            
            <button data-val="4" data-speech="4">4</button>
            <button data-val="5" data-speech="5">5</button>
            <button data-val="6" data-speech="6">6</button>
            <button class="btn-operator" data-val="-" data-speech="Minus">−</button>
            
            <button data-val="1" data-speech="1">1</button>
            <button data-val="2" data-speech="2">2</button>
            <button data-val="3" data-speech="3">3</button>
            <button class="btn-operator" data-val="+" data-speech="Plus">+</button>
            
            <button class="btn-zero" data-val="0" data-speech="0">0</button>
            <button data-val="." data-speech="Point">.</button>
            <button class="btn-equals" data-val="=" data-speech="Equals">=</button>
        </div>
    </div>

    <script>
        // --- Sound Effects Setup (Tone.js) ---
        let clickSynth = null;
        let isAudioInitialized = false;

        function initAudio() {
            if (!isAudioInitialized) {
                Tone.start(); // Required to unlock audio context in browsers
                // Create a subtle click/pop sound
                clickSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01,
                    octaves: 2,
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.01 }
                }).toDestination();
                clickSynth.volume.value = -15; // Soft volume
                isAudioInitialized = true;
            }
        }

        function playClickSound() {
            initAudio();
            if (clickSynth) {
                // Play a high, short pop note
                clickSynth.triggerAttackRelease("C5", "32n");
            }
        }

        // --- Voice Synthesis Setup ---
        const synth = window.speechSynthesis;

        function speak(text) {
            // Cancel any ongoing speech so it doesn't queue up too long
            synth.cancel();
            if (text !== '') {
                const utterThis = new SpeechSynthesisUtterance(text);
                // Adjust voice properties for a slightly snappier feel
                utterThis.rate = 1.3; 
                utterThis.pitch = 1.1;
                synth.speak(utterThis);
            }
        }

        // --- Calculator Logic ---
        const displayResult = document.getElementById('result');
        const displayHistory = document.getElementById('history');
        let currentExpression = '';
        let shouldResetDisplay = false;

        function updateDisplay(val) {
            displayResult.innerText = val;
            // Scroll to end if too long
            displayResult.scrollLeft = displayResult.scrollWidth;
        }

        function handleInput(val, speechText) {
            playClickSound();

            if (val === 'C') {
                currentExpression = '';
                updateDisplay('0');
                displayHistory.innerText = '';
                speak(speechText);
                return;
            }

            if (val === '=') {
                try {
                    // Safe evaluation using new Function instead of direct eval
                    // Replace standard symbols if necessary (our data-vals are already JS friendly)
                    let result = new Function('return ' + currentExpression)();
                    
                    // Handle float precision issues
                    result = Math.round(result * 100000000) / 100000000;
                    
                    displayHistory.innerText = currentExpression + ' =';
                    updateDisplay(result);
                    
                    // Trigger pulse animation on result
                    displayResult.classList.remove('pulse');
                    void displayResult.offsetWidth; // trigger reflow
                    displayResult.classList.add('pulse');

                    speak(speechText + " " + result);
                    currentExpression = result.toString();
                    shouldResetDisplay = true;
                } catch (e) {
                    updateDisplay('Error');
                    speak('Error');
                    currentExpression = '';
                    shouldResetDisplay = true;
                }
                return;
            }

            // Normal input handling
            if (shouldResetDisplay && !['+', '-', '*', '/'].includes(val)) {
                currentExpression = '';
                shouldResetDisplay = false;
            } else {
                shouldResetDisplay = false;
            }

            currentExpression += val;
            updateDisplay(currentExpression);
            speak(speechText);
        }

        // --- Event Listeners ---
        const buttons = document.querySelectorAll('button');
        buttons.forEach(button => {
            // Touch and click handling
            const triggerButton = (e) => {
                e.preventDefault(); // Prevent double firing on touch devices
                
                // Visual CSS Animation trigger
                button.classList.add('animating');
                setTimeout(() => button.classList.remove('animating'), 150);

                const val = button.getAttribute('data-val');
                const speech = button.getAttribute('data-speech');
                handleInput(val, speech);
            };

            button.addEventListener('mousedown', triggerButton);
            button.addEventListener('touchstart', triggerButton, {passive: false});
        });

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                'Enter': '=',
                'Escape': 'C',
                'Backspace': 'C',
                'x': '*'
            };
            
            let key = e.key;
            if (keyMap[key]) key = keyMap[key];

            const button = document.querySelector(`button[data-val="${key}"]`);
            if (button) {
                button.classList.add('animating');
                setTimeout(() => button.classList.remove('animating'), 150);
                
                const val = button.getAttribute('data-val');
                const speech = button.getAttribute('data-speech');
                handleInput(val, speech);
            }
        });

    </script>
</body>
</html>
